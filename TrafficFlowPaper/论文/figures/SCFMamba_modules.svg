<path d="M 436 510 L 461 510" fill="none" stroke="#404040" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 650 510 L 675 510" fill="none" stroke="#404040" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 825 510 L 850 510" fill="none" stroke="#404040" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 1035 570 L 1035 586 L 250 586 L 250 602" fill="none" stroke="#404040" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="604" width="420" height="100" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.4"/>
<rect x="500" y="604" width="720" height="100" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.4"/>
<rect x="20" y="760" width="1220" height="350" rx="12" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="1.4" stroke-dasharray="8 6"/>
<rect x="40" y="850" width="200" height="100" rx="8" fill="#E8E1F2" stroke="#7030A0" stroke-width="1.4"/>
<rect x="265" y="850" width="220" height="100" rx="8" fill="#E8E1F2" stroke="#7030A0" stroke-width="1.4"/>

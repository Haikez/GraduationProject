<path d="M 240 900 L 265 900" fill="none" stroke="#404040" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 485 900 L 510 900" fill="none" stroke="#404040" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 740 900 L 765 900" fill="none" stroke="#404040" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 985 900 L 1010 900" fill="none" stroke="#404040" stroke-width="1.6" marker-end="url(#ah)"/>
<text text-anchor="start" fill="#3F4A56" font-weight="bold"><tspan x="40" y="34" font-size="20.0">(b) SCI 交互块（每级）：奇偶分流、卷积交互与节点状态空间调制</tspan></text>
<text text-anchor="middle" fill="#12385A" font-weight="bold"><tspan x="115" y="133.52" font-size="20.0">输入</tspan></text>
<text text-anchor="middle" fill="#12385A"><tspan x="115" y="161.38400000000001" font-size="16.0">Z：B×T×N</tspan></text>
<text text-anchor="middle" fill="#12385A" font-weight="bold"><tspan x="305" y="118.94" font-size="20.0">奇偶分流</tspan></text>
<text text-anchor="middle" fill="#12385A"><tspan x="305" y="147.938" font-size="17.0">偶 E：T/2</tspan></text>
<text text-anchor="middle" fill="#12385A"><tspan x="305" y="175.47799999999998" font-size="17.0">奇 O：T/2</tspan></text>
<text text-anchor="middle" fill="#12385A" font-weight="bold"><tspan x="520" y="132.71" font-size="20.0">4 × 卷积支路</tspan></text>
<text text-anchor="middle" fill="#12385A"><tspan x="520" y="161.708" font-size="17.0">核 5 → 核 3</tspan></text>
<text text-anchor="middle" fill="#7A3305" font-weight="bold"><tspan x="745" y="118.94" font-size="20.0">尺度调制</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="745" y="147.938" font-size="17.0">O ⊙ exp(Δ</tspan><tspan dy="3.40" font-size="12.2">o</tspan><tspan dy="-3.40" font-size="17.0">)</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="745" y="175.47799999999998" font-size="17.0">E ⊙ exp(Δ</tspan><tspan dy="3.40" font-size="12.2">e</tspan><tspan dy="-3.40" font-size="17.0">)</tspan></text>
<text text-anchor="middle" fill="#7A3305" font-weight="bold"><tspan x="970" y="118.94" font-size="20.0">增量更新</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="970" y="147.938" font-size="17.0">E″ = E′ + Δ</tspan><tspan dy="3.40" font-size="12.2">e</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="970" y="175.47799999999998" font-size="17.0">O″ = O′ − Δ</tspan><tspan dy="3.40" font-size="12.2">o</tspan></text>
<text text-anchor="middle" fill="#2C4A18" font-weight="bold"><tspan x="1157.5" y="133.52" font-size="20.0">输出</tspan></text>
<text text-anchor="middle" fill="#2C4A18"><tspan x="1157.5" y="161.38400000000001" font-size="16.0">Z′：B×T×N</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="40" y="232" font-size="17.0">E′ = E ⊙ exp(NM(Conv</tspan><tspan dy="3.40" font-size="12.2">ψe</tspan><tspan dy="-3.40" font-size="17.0">(O)))，O′ = O ⊙ exp(NM(Conv</tspan><tspan dy="3.40" font-size="12.2">ψo</tspan><tspan dy="-3.40" font-size="17.0">(E)))</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="40" y="262" font-size="17.0">E″ = E′ + NM(Conv</tspan><tspan dy="3.40" font-size="12.2">φe</tspan><tspan dy="-3.40" font-size="17.0">(O′))，O″ = O′ − NM(Conv</tspan><tspan dy="3.40" font-size="12.2">φo</tspan><tspan dy="-3.40" font-size="17.0">(E′))</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="40" y="292" font-size="16.0">Conv：ReplicationPad1d(3,3) → Conv1d(核5) → LeakyReLU → Dropout(0.5) → Conv1d(核3) → Tanh；隐藏宽度 ⌊N/16⌋；NM 为 NodeMamba。</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="40" y="322" font-size="16.0">注：一级块 T = 96、二级块 T = 48；每级合并前调用共享交叉注意力，输出按原时间索引交错还原为 T 步。</tspan></text>
<text text-anchor="start" fill="#3F4A56" font-weight="bold"><tspan x="40" y="414" font-size="20.0">(c) NodeMamba 块：沿节点轴的双向选择性状态空间（SSM）</tspan></text>
<text text-anchor="middle" fill="#7A3305" font-weight="bold"><tspan x="125" y="488.93999999999994" font-size="20.0">节点特征</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="125" y="517.9379999999999" font-size="17.0">F：B×N×L</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="125" y="545.4779999999998" font-size="17.0">L = T/2</tspan></text>
<text text-anchor="middle" fill="#7A3305" font-weight="bold"><tspan x="310" y="502.7099999999999" font-size="20.0">线性投影</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="310" y="531.7079999999999" font-size="17.0">L → 128</tspan></text>
<text text-anchor="middle" fill="#111111"><tspan x="420" y="448" font-size="16.0">+ 节点嵌入 N×128</tspan></text>
<text text-anchor="middle" fill="#7A3305" font-weight="bold"><tspan x="555" y="488.93999999999994" font-size="20.0">拼接日历特征</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="555" y="517.9379999999999" font-size="17.0">cat(128, 64)</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="555" y="545.4779999999998" font-size="17.0">→ 192</tspan></text>
<text text-anchor="middle" fill="#7A3305" font-weight="bold"><tspan x="750" y="502.7099999999999" font-size="20.0">线性投影</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="750" y="531.7079999999999" font-size="17.0">192 → 128</tspan></text>
<text text-anchor="middle" fill="#7A3305" font-weight="bold"><tspan x="1035" y="488.93999999999994" font-size="20.0">双向 Mamba（沿节点轴扫描）</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="1035" y="517.9379999999999" font-size="17.0">正向 + 反向翻转，输出相加</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="1035" y="545.4779999999998" font-size="17.0">d_state = 32，d_conv = 2</tspan></text>
<text text-anchor="middle" fill="#7A3305" font-weight="bold"><tspan x="250" y="621.5999999999999" font-size="20.0">前馈 + 门控残差</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="250" y="649.4639999999999" font-size="16.0">LayerNorm → 1×1 Conv + GELU</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="250" y="675.3839999999999" font-size="16.0">Dropout(0.1) → 1×1 Conv</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="250" y="701.3039999999999" font-size="16.0">Linear(128 → L)，F + tanh(g)·ΔF</tspan></text>
<text text-anchor="middle" fill="#7A3305" font-weight="bold"><tspan x="860" y="634.56" font-size="20.0">状态递推（沿节点索引 k）</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="860" y="662.424" font-size="16.0">h</tspan><tspan dy="3.20" font-size="11.5">k</tspan><tspan dy="-3.20" font-size="16.0"> = exp(Δ</tspan><tspan dy="3.20" font-size="11.5">k</tspan><tspan dy="-3.20" font-size="16.0"> ⊙ A) ⊙ h</tspan><tspan dy="3.20" font-size="11.5">k−1</tspan><tspan dy="-3.20" font-size="16.0"> + Δ</tspan><tspan dy="3.20" font-size="11.5">k</tspan><tspan dy="-3.20" font-size="16.0"> ⊙ (B x</tspan><tspan dy="3.20" font-size="11.5">k</tspan><tspan dy="-3.20" font-size="16.0">)</tspan></text>
<text text-anchor="middle" fill="#7A3305"><tspan x="860" y="688.3439999999999" font-size="16.0">y</tspan><tspan dy="3.20" font-size="11.5">k</tspan><tspan dy="-3.20" font-size="16.0"> = (C</tspan><tspan dy="3.20" font-size="11.5">k</tspan><tspan dy="-3.20" font-size="16.0"> ⊙ h</tspan><tspan dy="3.20" font-size="11.5">k</tspan><tspan dy="-3.20" font-size="16.0"> + D ⊙ x</tspan><tspan dy="3.20" font-size="11.5">k</tspan><tspan dy="-3.20" font-size="16.0">) ⊙ silu(G</tspan><tspan dy="3.20" font-size="11.5">k</tspan><tspan dy="-3.20" font-size="16.0">)，A = −exp(A_log)</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="40" y="724" font-size="16.0">注：双向分支分别沿节点维正序与逆序扫描（逆序分支翻转后再翻转回来）；日历嵌入在每个 NodeMamba 内经 Linear(192→128) 注入。</tspan></text>
<text text-anchor="start" fill="#3F4A56" font-weight="bold"><tspan x="40" y="794" font-size="20.0">(d) 共享双向交叉注意力融合（每级合并前调用，参数共享）</tspan></text>
<text text-anchor="middle" fill="#3F1A5E" font-weight="bold"><tspan x="140" y="880.236" font-size="19.0">两路输入</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="140" y="907.614" font-size="16.0">偶序列 E：B×L</tspan><tspan dy="3.20" font-size="11.5">e</tspan><tspan dy="-3.20" font-size="16.0">×N</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="140" y="933.534" font-size="16.0">奇序列 O：B×L</tspan><tspan dy="3.20" font-size="11.5">o</tspan><tspan dy="-3.20" font-size="16.0">×N</tspan></text>
<text text-anchor="middle" fill="#3F1A5E" font-weight="bold"><tspan x="375" y="880.236" font-size="19.0">线性投影 + 位置编码</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="375" y="907.614" font-size="16.0">Linear(N → 64)</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="375" y="933.534" font-size="16.0">+ 正弦 PE（原始索引）</tspan></text>
<text text-anchor="middle" fill="#3F1A5E" font-weight="bold"><tspan x="625" y="878.9399999999999" font-size="20.0">4 头交叉注意力</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="625" y="907.9379999999999" font-size="17.0">Q = E, K = V = O</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="625" y="935.4779999999998" font-size="17.0">Q = O, K = V = E</tspan></text>
<text text-anchor="middle" fill="#2C4A18" font-weight="bold"><tspan x="875" y="867.276" font-size="19.0">输出投影 + 残差</tspan></text>
<text text-anchor="middle" fill="#2C4A18"><tspan x="875" y="894.654" font-size="16.0">Linear(64 → N)</tspan></text>
<text text-anchor="middle" fill="#2C4A18"><tspan x="875" y="920.574" font-size="16.0">E + tanh(g</tspan><tspan dy="3.20" font-size="11.5">E</tspan><tspan dy="-3.20" font-size="16.0">) · ΔE</tspan></text>
<text text-anchor="middle" fill="#2C4A18"><tspan x="875" y="946.4939999999999" font-size="16.0">O + tanh(g</tspan><tspan dy="3.20" font-size="11.5">O</tspan><tspan dy="-3.20" font-size="16.0">) · ΔO</tspan></text>
<text text-anchor="middle" fill="#3F1A5E" font-weight="bold"><tspan x="1120" y="880.236" font-size="19.0">输出</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="1120" y="907.614" font-size="16.0">E′：B×L</tspan><tspan dy="3.20" font-size="11.5">e</tspan><tspan dy="-3.20" font-size="16.0">×N</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="1120" y="933.534" font-size="16.0">O′：B×L</tspan><tspan dy="3.20" font-size="11.5">o</tspan><tspan dy="-3.20" font-size="16.0">×N</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="40" y="1000" font-size="17.0">ΔE = W</tspan><tspan dy="3.40" font-size="12.2">o</tspan><tspan dy="-3.40" font-size="17.0"> · softmax(Q</tspan><tspan dy="3.40" font-size="12.2">E</tspan><tspan dy="-3.40" font-size="17.0"> K</tspan><tspan dy="3.40" font-size="12.2">O</tspan><tspan dy="-8.50" font-size="12.2">⊤</tspan><tspan dy="5.10" font-size="17.0"> / √d</tspan><tspan dy="3.40" font-size="12.2">h</tspan><tspan dy="-3.40" font-size="17.0">) V</tspan><tspan dy="3.40" font-size="12.2">O</tspan><tspan dy="-3.40" font-size="17.0">，ΔO = W</tspan><tspan dy="3.40" font-size="12.2">o</tspan><tspan dy="-3.40" font-size="17.0"> · softmax(Q</tspan><tspan dy="3.40" font-size="12.2">O</tspan><tspan dy="-3.40" font-size="17.0"> K</tspan><tspan dy="3.40" font-size="12.2">E</tspan><tspan dy="-8.50" font-size="12.2">⊤</tspan><tspan dy="5.10" font-size="17.0"> / √d</tspan><tspan dy="3.40" font-size="12.2">h</tspan><tspan dy="-3.40" font-size="17.0">) V</tspan><tspan dy="3.40" font-size="12.2">E</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="40" y="1032" font-size="16.0">token 为时间步（长度 L</tspan><tspan dy="3.20" font-size="11.5">e</tspan><tspan dy="-3.20" font-size="16.0"> / L</tspan><tspan dy="3.20" font-size="11.5">o</tspan><tspan dy="-3.20" font-size="16.0">），特征维为节点数 N；位置编码按原始 96 步索引取值。</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="40" y="1062" font-size="16.0">该模块只沿时间索引交换信息、不跨节点传播；跨节点建模由卷积支路与 NodeMamba 承担。</tspan></text>
</svg>
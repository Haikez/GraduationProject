<text text-anchor="middle" fill="#595959"><tspan x="540" y="332" font-size="16.0">残差连接：主干输出 + 位置编码后的输入</tspan></text>
<text text-anchor="middle" fill="#1A1A1A" font-weight="bold"><tspan x="90" y="164.17" font-size="20.0">输入</tspan></text>
<text text-anchor="middle" fill="#1A1A1A"><tspan x="90" y="193.16799999999998" font-size="17.0">历史流量 X</tspan></text>
<text text-anchor="middle" fill="#1A1A1A"><tspan x="90" y="220.70799999999997" font-size="17.0">B×96×N</tspan></text>
<text text-anchor="middle" fill="#1A1A1A"><tspan x="90" y="248.248" font-size="17.0">（仅流量通道）</tspan></text>
<text text-anchor="middle" fill="#1A1A1A" font-weight="bold"><tspan x="185" y="50.872" font-size="18.0">节点维位置编码</tspan></text>
<text text-anchor="middle" fill="#1A1A1A"><tspan x="185" y="77.76400000000001" font-size="16.0">96×N（固定）</tspan></text>
<text text-anchor="middle" fill="#12385A" font-weight="bold"><tspan x="300" y="164.17" font-size="20.0">SCI 交互块</tspan></text>
<text text-anchor="middle" fill="#12385A"><tspan x="300" y="193.16799999999998" font-size="17.0">一级 · T = 96</tspan></text>
<text text-anchor="middle" fill="#12385A"><tspan x="300" y="220.70799999999997" font-size="17.0">奇偶分流 + 卷积</tspan></text>
<text text-anchor="middle" fill="#12385A"><tspan x="300" y="248.248" font-size="17.0">4 × NodeMamba</tspan></text>
<text text-anchor="middle" fill="#12385A" font-weight="bold"><tspan x="505" y="137.386" font-size="19.0">二级 SCI 块</tspan></text>
<text text-anchor="middle" fill="#12385A"><tspan x="505" y="165.898" font-size="17.0">偶支 · T = 48</tspan></text>
<text text-anchor="middle" fill="#12385A" font-weight="bold"><tspan x="505" y="245.386" font-size="19.0">二级 SCI 块</tspan></text>
<text text-anchor="middle" fill="#12385A"><tspan x="505" y="273.898" font-size="17.0">奇支 · T = 48</tspan></text>
<text text-anchor="middle" fill="#3F1A5E" font-weight="bold"><tspan x="720" y="163.522" font-size="18.0">共享双向交叉注意力</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="720" y="191.54799999999997" font-size="17.0">4 头 · tanh 门控</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="720" y="219.08799999999997" font-size="17.0">每级合并前调用</tspan></text>
<text text-anchor="middle" fill="#3F1A5E"><tspan x="720" y="246.62799999999996" font-size="17.0">参数共享 ×3</tspan></text>
<text text-anchor="middle" fill="#6B5000" font-weight="bold"><tspan x="965" y="166.6" font-size="20.0">多步预测头</tspan></text>
<text text-anchor="middle" fill="#6B5000"><tspan x="965" y="194.464" font-size="16.0">1×1 Conv1d</tspan></text>
<text text-anchor="middle" fill="#6B5000"><tspan x="965" y="220.38400000000001" font-size="16.0">96 → H</tspan></text>
<text text-anchor="middle" fill="#6B5000"><tspan x="965" y="246.30400000000003" font-size="16.0">各节点共享权重</tspan></text>
<text text-anchor="middle" fill="#1A1A1A" font-weight="bold"><tspan x="1140" y="177.94" font-size="20.0">输出</tspan></text>
<text text-anchor="middle" fill="#1A1A1A"><tspan x="1140" y="206.938" font-size="17.0">Ŷ</tspan></text>
<text text-anchor="middle" fill="#1A1A1A"><tspan x="1140" y="234.47799999999998" font-size="17.0">B×H×N</tspan></text>
<text text-anchor="middle" fill="#595959"><tspan x="680" y="318" font-size="16.0">交叉注意力输出按原时间索引交错合并后，与位置编码后的输入做残差相加</tspan></text>
<text text-anchor="middle" fill="#1A1A1A" font-weight="bold"><tspan x="105" y="486.6" font-size="20.0">历史时间戳</tspan></text>
<text text-anchor="middle" fill="#1A1A1A"><tspan x="105" y="514.464" font-size="16.0">S：B×96×2</tspan></text>
<text text-anchor="middle" fill="#1A1A1A"><tspan x="105" y="540.384" font-size="16.0">（日内/288）</tspan></text>
<text text-anchor="middle" fill="#1A1A1A"><tspan x="105" y="566.304" font-size="16.0">（七日/7）</tspan></text>
<text text-anchor="middle" fill="#12414F" font-weight="bold"><tspan x="345" y="497.93999999999994" font-size="20.0">日历嵌入</tspan></text>
<text text-anchor="middle" fill="#12414F"><tspan x="345" y="526.9379999999999" font-size="17.0">288×32 + 7×32</tspan></text>
<text text-anchor="middle" fill="#12414F"><tspan x="345" y="554.4779999999998" font-size="17.0">c：B×64</tspan></text>
<text text-anchor="start" fill="#1F6B7A"><tspan x="360" y="405" font-size="16.0">日历条件 c：注入每个 NodeMamba 块</tspan></text>
<text text-anchor="start" fill="#333333" font-weight="bold"><tspan x="516" y="494" font-size="17.0">图例</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="544" y="520" font-size="16.0">时间卷积 / 主干</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="884" y="520" font-size="16.0">节点状态空间（SSM）</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="544" y="552" font-size="16.0">交叉注意力</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="884" y="552" font-size="16.0">门控与融合</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="544" y="584" font-size="16.0">预测头</tspan></text>
<text text-anchor="start" fill="#111111"><tspan x="884" y="584" font-size="16.0">输入 / 输出</tspan></text>
